  dateFormat: January 2, 2006 at 3:04 PM MST
  shortDateFormat: Jan 2 at 3:04 PM MST
  useRelativeTime: false
  skipSeconds: true
  enableLastMod: true
  useLargeHeaderDesign: true
  incidentHistoryFormat: yearly
  disableIncidentHistory: false
  disableDarkMode: false
  useLogo: true
  logo: logo.png
  description: >-
    Shareline is currently in prototype development. Operational status indicates that a feature works in the current local prototype environment. Some features do not yet include cloud synchronization, public hosting, cross-device delivery, or production backend infrastructure. The iOS prototype is currently more complete than the Android prototype.
  disableComplexCalculations: false
  incidentPostsPerPage: 10
  brand: "#1162DC"
  ok: "#34C759"
  disrupted: "#FF7A00"
  down: "#FF3B30"
  notice: "#FFB020"
  degradedPerformance: "#FFB020"
  partialOutage: "#FF7A00"
  majorOutage: "#FF3B30"
  underMaintenance: "#0A84FF"
  alwaysKeepBrandColor: true
  headerTextColor: white
theme: cstate
preserveTaxonomyNames: true
taxonomies:
  affected: affected
